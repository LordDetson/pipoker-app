spring.main.banner-mode=off
spring.profiles.default=prod
# How long a seat waits for its person to come back after a lost connection or a closed page (see RoomPresence)
presence.grace-period=10s
presence.startup-grace-period=30s
# A room nobody does anything in for this long is closed, and everyone still in it leaves (see IdleRoomCloser)
room.idle-timeout=30m
room.idle-check-interval=1m
# Metrics for the activity dashboard (see RoomActivity) on their own port: the proxy in front of the backend
# forwards only /ws on the application port, so the metrics are reachable from the server's internal network alone
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
# Jackson 3 changed these two defaults, the old ones keep the JSON the web client exchanges with the backend as it was:
# a property left out is read as its default (a room's votesShown is left out while it is false),
# and properties are written in the order the class declares them
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.mapper.sort-properties-alphabetically=false
