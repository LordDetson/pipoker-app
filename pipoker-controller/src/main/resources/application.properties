spring.main.banner-mode=off
spring.profiles.default=prod
# How long a seat waits for its person to come back after a lost connection or a closed page (see RoomPresence)
presence.grace-period=10s
presence.startup-grace-period=30s
# A room nobody does anything in for this long is closed, and everyone still in it leaves (see IdleRoomCloser)
room.idle-timeout=30m
room.idle-check-interval=1m
# Metrics for the activity dashboard (see RoomActivity) on their own port: the proxy in front of the backend
# forwards only /ws on the application port, so the metrics are reachable from the server's internal network alone
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
# Jackson 3 changed several defaults, among them how a left-out property, a collection without a setter and the order
# of properties are handled. Jackson 2's defaults keep the JSON the web client exchanges with the backend as it was
spring.jackson.use-jackson2-defaults=true
# Feedback from the site (see FeedbackController): at most this many messages from one address and from everyone
# together in the window, which keeps spam out of Jira. It becomes issues of the Jira project once the server has
# JIRA_URL, JIRA_EMAIL and JIRA_API_TOKEN, a problem a bug and an idea or a review a task, and is only logged until then
feedback.limit-per-address=3
feedback.limit-in-total=20
feedback.limit-window=1h
feedback.environment=${PIPOKER_ENV:}
feedback.jira.url=${JIRA_URL:}
feedback.jira.email=${JIRA_EMAIL:}
feedback.jira.api-token=${JIRA_API_TOKEN:}
feedback.jira.project=${JIRA_PROJECT:PIP}
feedback.jira.issue-type.problem=Bug
feedback.jira.issue-type.idea=Task
feedback.jira.issue-type.review=Task
# The proxy in front of the backend tells the browser's address in X-Forwarded-For, which feedback is limited by
server.forward-headers-strategy=native
