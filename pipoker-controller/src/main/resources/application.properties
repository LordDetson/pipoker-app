spring.main.banner-mode=off
spring.profiles.default=prod
# How long a seat waits for its person to come back after a lost connection or a closed page (see RoomPresence)
presence.grace-period=10s
presence.startup-grace-period=30s
# A room nobody does anything in for this long is closed, and everyone still in it leaves (see IdleRoomCloser)
room.idle-timeout=30m
room.idle-check-interval=1m
# Metrics for the activity dashboard (see RoomActivity) on their own port: the proxy in front of the backend
# forwards only /ws on the application port, so the metrics are reachable from the server's internal network alone
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
# Jackson 3 changed several defaults, among them how a left-out property, a collection without a setter and the order
# of properties are handled. Jackson 2's defaults keep the JSON the web client exchanges with the backend as it was
spring.jackson.use-jackson2-defaults=true
# Bug reports from the site (see BugReportController): at most this many from one address and from everyone together
# in the window, which keeps spam out of Jira. They become issues of the Jira project once the server has JIRA_URL,
# JIRA_EMAIL and JIRA_API_TOKEN, and are only logged until then
bug-report.limit-per-address=3
bug-report.limit-in-total=20
bug-report.limit-window=1h
bug-report.environment=${PIPOKER_ENV:}
bug-report.jira.url=${JIRA_URL:}
bug-report.jira.email=${JIRA_EMAIL:}
bug-report.jira.api-token=${JIRA_API_TOKEN:}
bug-report.jira.project=${JIRA_PROJECT:PIP}
bug-report.jira.issue-type=Bug
# The proxy in front of the backend tells the browser's address in X-Forwarded-For, which bug reports are limited by
server.forward-headers-strategy=native
