server.port=${APP_PORT:8080}
spring.devtools.add-properties=false

# Which page origins may open a room WebSocket. The servers set it to their own domains (see the environment
# files); left unset it allows any origin, which is only meant for local development.
broker.stomp.endpoint.allowedOriginPatterns=${STOMP_ALLOWED_ORIGINS:*}

broker.host=${BROKER_HOST}
broker.stomp.port=${STOMP_BROKER_PORT:61613}
broker.stomp.system.login=${STOMP_BROKER_SYSTEM_LOGIN}
broker.stomp.system.pass=${STOMP_BROKER_SYSTEM_PASS}
broker.stomp.user.login=${STOMP_BROKER_USER_LOGIN}
broker.stomp.user.pass=${STOMP_BROKER_USER_PASS}
