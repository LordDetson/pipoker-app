name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [prod, qa]
        default: prod
      tag:
        description: Image tag to deploy (commit SHA that passed QA)
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend-${{ inputs.environment }}
    # Approval for prod is configured in the "prod" environment settings (required reviewers)
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy over SSH
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'pipoker-docker-config/server' }}
        run: |
          [[ "$ENVIRONMENT" =~ ^(qa|prod)$ ]] || { echo "Unknown environment: $ENVIRONMENT"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$TARGET" "$DEPLOY_PATH/deploy $ENVIRONMENT backend $TAG"
