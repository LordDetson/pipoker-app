name: Promote to PROD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit SHA that was checked on QA
        type: string
        required: true

env:
  IMAGE_NAME: ghcr.io/lorddetson/pipoker-controller

jobs:
  promote:
    runs-on: ubuntu-latest
    # Approval is configured in the "prod" environment settings (required reviewers)
    environment: prod
    permissions:
      # Writes the release
      contents: write
      packages: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The PROD environment on the server picks up the prod tag within a few minutes
      - name: Tag the image as prod
        env:
          TAG: ${{ inputs.tag }}
        run: docker buildx imagetools create --tag "$IMAGE_NAME:prod" "$IMAGE_NAME:$TAG"

      # A release marks what went to PROD and when: the tag is the day of the promotion in Minsk time (a second
      # promotion on the same day gets a counter), and the notes are the pull requests merged since the previous
      # release. Software catalogs such as awesome-selfhosted list only projects with tagged releases.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          day=$(TZ=Europe/Minsk date +%Y.%m.%d)
          release="v$day"
          n=1
          while gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            n=$((n + 1))
            release="v$day.$n"
          done
          gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$TAG" --title "$release" --generate-notes
