name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/lorddetson/pipoker-controller

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Prepare application jar
        run: find pipoker-controller/target -maxdepth 1 -name 'pipoker-controller-*.jar' ! -name '*-sources.jar' -exec cp {} pipoker-controller/target/app.jar \;

      - uses: actions/upload-artifact@v4
        with:
          name: pipoker-controller
          path: pipoker-controller/target/app.jar
          retention-days: 7

  image:
    # Images are published only from main, pull requests are just built and tested
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pipoker-controller
          path: pipoker-controller/target

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: pipoker-controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy-qa:
    # Every push to main goes to QA once the deployment server is configured (repository variable DEPLOY_HOST)
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      tag: ${{ github.sha }}
    secrets: inherit
