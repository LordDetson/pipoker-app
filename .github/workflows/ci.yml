name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/lorddetson/pipoker-controller

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Unit tests and integration tests; the integration tests start MongoDB and RabbitMQ in Docker
      - name: Build and test
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "| Module | Lines | Branches |"
            echo "| --- | --- | --- |"
            for module in pipoker-service pipoker-controller; do
              report="$module/target/site/jacoco/jacoco.csv"
              [ -f "$report" ] || continue
              awk -F, -v module="$module" 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
                END { printf "| %s | %.1f%% | %.1f%% |\n", module, 100 * lc / (lm + lc), bm + bc ? 100 * bc / (bm + bc) : 100 }' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            */target/site/jacoco/
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 7

      - name: Prepare application jar
        run: find pipoker-controller/target -maxdepth 1 -name 'pipoker-controller-*.jar' ! -name '*-sources.jar' -exec cp {} pipoker-controller/target/app.jar \;

      - uses: actions/upload-artifact@v4
        with:
          name: pipoker-controller
          path: pipoker-controller/target/app.jar
          retention-days: 7

  image:
    # Images are published only from main, pull requests are just built and tested.
    # The qa tag is picked up by the QA environment on the server (see pipoker-docker-config/server).
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pipoker-controller
          path: pipoker-controller/target

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: pipoker-controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:qa
